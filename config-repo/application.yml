# ====================================================================
# GESCO: Global Shared Configuration
# These properties are merged into ALL microservices at startup.
# Service-specific files (e.g. service-sales.yml) can override these.
# ====================================================================
spring:
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}

# Eureka registration (all services will use this)
eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
