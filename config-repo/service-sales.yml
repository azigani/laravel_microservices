# ====================================================================
# GESCO: service-sales specific configuration
# Overrides and extends the global application.yml
# ====================================================================
server:
  port: 8083

spring:
  application:
    name: service-sales
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gesco_sales}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
