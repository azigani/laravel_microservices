version: '3.8'

services:
  # Databases
  postgres:
    image: postgres:15-alpine
    container_name: gesco_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  mongodb:
    image: mongo:latest
    container_name: gesco_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # Message Broker
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: gesco_rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  # Caching & Session
  redis:
    image: redis:alpine
    container_name: gesco_redis
    ports:
      - "6379:6379"

  # Application Services
  discovery-server:
    build:
      context: ./services/discovery-server
      dockerfile: Dockerfile
    container_name: gesco_discovery_server
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  config-server:
    build:
      context: ./services/config-server
      dockerfile: Dockerfile
    container_name: gesco_config_server
    ports:
      - "8888:8888"
    environment:
      - EUREKA_URL=http://discovery-server:8761/eureka
    depends_on:
      - discovery-server

  # File Storage (S3 compatible)
  minio:
    image: minio/minio
    container_name: gesco_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  gateway:
    build: 
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: gesco_gateway
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      JWT_SECRET: laramel_super_secret_jwt_key_2024
      JWT_EXPIRATION: 7d
      INVENTORY_SERVICE_URL: http://inventory-service:3001
      IDENTITY_SERVICE_URL: http://identity-service:8000
      SALES_SERVICE_URL: http://service-sales:8083
      DOCUMENT_SERVICE_URL: http://service-document:8085
    depends_on:
      - redis
      - rabbitmq
      - identity-service

  identity-service:
    build:
      context: ./services/identity-service
      dockerfile: Dockerfile
    container_name: gesco_identity_service
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "IdentityService"
      APP_ENV: local
      APP_KEY: base64:mPCOnBo3fP81BQtk12rToOHAFG/JxnAssBhU7jI/yzI=
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: gesco_identity
      DB_USERNAME: admin
      DB_PASSWORD: password
      JWT_SECRET: laramel_super_secret_jwt_key_2024
    depends_on:
      - postgres

  inventory-service:
    build:
      context: ./services/inventory-service
      dockerfile: Dockerfile
    container_name: gesco_inventory_service
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: gesco_inventory
      DB_USER: admin
      DB_PASSWORD: password
      DB_SYNC: "true"
      EUREKA_HOST: discovery-server
      EUREKA_PORT: 8761
      HOSTNAME: inventory-service
    depends_on:
      - postgres
      - rabbitmq
      - discovery-server

  service-analytics:
    build:
      context: ./services/service-analytics
      dockerfile: Dockerfile
    container_name: gesco_analytics_service
    ports:
      - "8001:8001"
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      - mongodb
      - rabbitmq

  service-sales:
    build:
      context: ./services/service-sales
      dockerfile: Dockerfile
    container_name: gesco_sales_service
    ports:
      - "8083:8083"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/gesco_sales
      DB_USER: admin
      DB_PASS: password
      RABBITMQ_HOST: rabbitmq
      EUREKA_URL: http://discovery-server:8761/eureka
    depends_on:
      - postgres
      - rabbitmq
      - discovery-server

  service-notification:
    build:
      context: ./services/service-notification
      dockerfile: Dockerfile
    container_name: gesco_notification_service
    ports:
      - "8084:8084"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/gesco_notification
      DB_USER: admin
      DB_PASS: password
      RABBITMQ_HOST: rabbitmq
      EUREKA_URL: http://discovery-server:8761/eureka
    depends_on:
      - postgres
      - rabbitmq
      - discovery-server

  zipkin:
    image: openzipkin/zipkin
    container_name: gesco_zipkin
    ports:
      - "9411:9411"
    restart: always

  service-document:
    build:
      context: ./services/service-document-ged
      dockerfile: Dockerfile
    container_name: gesco_document_service
    ports:
      - "8085:8085"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/gesco_document
      DB_USER: admin
      DB_PASS: password
      RABBITMQ_HOST: rabbitmq
      MINIO_ENDPOINT: http://minio:9000
      EUREKA_URL: http://discovery-server:8761/eureka
    depends_on:
      - postgres
      - rabbitmq
      - minio
      - discovery-server

  service-audit:
    build:
      context: ./services/service-audit
      dockerfile: Dockerfile
    container_name: gesco_audit_service
    ports:
      - "8086:8086"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/gesco_audit
      RABBITMQ_HOST: rabbitmq
      EUREKA_URL: http://discovery-server:8761/eureka
      CONFIG_SERVER_URL: http://config-server:8888
    depends_on:
      - mongodb
      - rabbitmq
      - discovery-server

  service-payment:
    build:
      context: ./services/service-payment
      dockerfile: Dockerfile
    container_name: gesco_payment_service
    ports:
      - "8087:8087"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/gesco_payment
      DB_USER: admin
      DB_PASS: password
      RABBITMQ_HOST: rabbitmq
      EUREKA_URL: http://discovery-server:8761/eureka
      CONFIG_SERVER_URL: http://config-server:8888
      STRIPE_SECRET_KEY: sk_test_fake_key_for_dev
    depends_on:
      - postgres
      - rabbitmq
      - discovery-server

volumes:
  postgres_data:
  mongo_data:
  minio_data:

