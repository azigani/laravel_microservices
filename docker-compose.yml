version: '3.8'

services:
  # Databases
  postgres:
    image: postgres:15-alpine
    container_name: gesco_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  mongodb:
    image: mongo:latest
    container_name: gesco_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # Message Broker
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: gesco_rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  # Caching & Session
  redis:
    image: redis:alpine
    container_name: gesco_redis
    ports:
      - "6379:6379"

  # Application Services
  gateway:
    build: 
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: gesco_gateway
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      JWT_SECRET: laramel_super_secret_jwt_key_2024
      JWT_EXPIRATION: 7d
      INVENTORY_SERVICE_URL: http://inventory-service:3001
      IDENTITY_SERVICE_URL: http://identity-service:8000
    depends_on:
      - redis
      - rabbitmq
      - identity-service

  identity-service:
    build:
      context: ./services/identity-service
      dockerfile: Dockerfile
    container_name: gesco_identity_service
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "IdentityService"
      APP_ENV: local
      APP_KEY: base64:mPCOnBo3fP81BQtk12rToOHAFG/JxnAssBhU7jI/yzI=
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: gesco_identity
      DB_USERNAME: admin
      DB_PASSWORD: password
      JWT_SECRET: laramel_super_secret_jwt_key_2024
    depends_on:
      - postgres

  inventory-service:
    build:
      context: ./services/inventory-service
      dockerfile: Dockerfile
    container_name: gesco_inventory_service
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: gesco_inventory
      DB_USER: admin
      DB_PASSWORD: password
      DB_SYNC: "true"
    depends_on:
      - postgres
      - rabbitmq

  sales-service:
    build:
      context: ./services/service-sales
      dockerfile: Dockerfile
    container_name: gesco_sales_service
    ports:
      - "3002:3002"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: gesco_sales
      DB_USER: admin
      DB_PASSWORD: password
    depends_on:
      - postgres
      - rabbitmq

  analytics-service:
    build:
      context: ./services/service-analytics
      dockerfile: Dockerfile
    container_name: gesco_analytics_service
    ports:
      - "8001:8001"
    environment:
      MONGO_URI: mongodb://mongodb:27017/gesco_analytics
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      - mongodb
      - rabbitmq

  document-service:
    build:
      context: ./services/service-document
      dockerfile: Dockerfile
    container_name: gesco_document_service
    ports:
      - "8002:8002"
    environment:
      APP_NAME: "DocumentService"
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      - postgres

volumes:
  postgres_data:
  mongo_data:
