global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'spring-boot-services'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'host.docker.internal:8888' # Config Server
          - 'host.docker.internal:8761' # Discovery Server
          - 'host.docker.internal:8080' # Gateway
          - 'host.docker.internal:8081' # Inventory
          - 'host.docker.internal:8082' # Sales
          - 'host.docker.internal:8083' # Pricing
          - 'host.docker.internal:8084' # Payment
          - 'host.docker.internal:8085' # Audit
          - 'host.docker.internal:8086' # Document
          - 'host.docker.internal:8087' # Notification
