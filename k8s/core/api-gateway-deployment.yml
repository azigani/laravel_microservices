apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: gesco
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: gesco/api-gateway:latest
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: gesco-config
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: gesco
spec:
  selector:
    app: api-gateway
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: LoadBalancer
