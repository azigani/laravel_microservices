apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: gesco
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server
    spec:
      containers:
      - name: config-server
        image: gesco/config-server:latest
        ports:
        - containerPort: 8888
        envFrom:
        - configMapRef:
            name: gesco-config
---
apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: gesco
spec:
  selector:
    app: config-server
  ports:
    - protocol: TCP
      port: 8888
      targetPort: 8888
  type: ClusterIP
