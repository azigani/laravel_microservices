apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-server
  namespace: gesco
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discovery-server
  template:
    metadata:
      labels:
        app: discovery-server
    spec:
      containers:
      - name: discovery-server
        image: gesco/discovery-server:latest
        ports:
        - containerPort: 8761
        envFrom:
        - configMapRef:
            name: gesco-config
---
apiVersion: v1
kind: Service
metadata:
  name: discovery-server
  namespace: gesco
spec:
  selector:
    app: discovery-server
  ports:
    - protocol: TCP
      port: 8761
      targetPort: 8761
  type: ClusterIP
