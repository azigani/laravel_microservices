server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: native  # Uses classpath resources instead of a Git repository
  cloud:
    config:
      server:
        native:
          # Configs are inside src/main/resources/config/
          search-locations: classpath:/config/

# Register with Eureka discovery server
eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
