# ====================================================================
# GESCO: Global Shared Configuration
# Automatically merged into ALL microservices that consume this server.
# Service-specific files (e.g. service-sales.yml) can override these.
# ====================================================================
spring:
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}

# Eureka registration (all services inherit this)
eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://discovery-server:8761/eureka}
  instance:
    prefer-ip-address: true

# Logging standard for all services (JSON-ready)
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{traceId}, %X{spanId}] %-5level %logger{36} - %msg%n"

# Distributed Tracing & Monitoring
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, tracing
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://zipkin:9411/api/v2/spans}

# Feign Configuration
feign:
  circuitbreaker:
    enabled: true
  micrometer:
    enabled: true

