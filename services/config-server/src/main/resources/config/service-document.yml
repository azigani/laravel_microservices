# ====================================================================
# GESCO: service-document (GED) specific configuration
# ====================================================================
server:
  port: 8085

spring:
  application:
    name: service-document
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/gesco_document}
    username: ${DB_USER:admin}
    password: ${DB_PASS:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

# MinIO (S3 compatible) file storage for GED
minio:
  endpoint: ${MINIO_ENDPOINT:http://minio:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket-name: gesco-documents
