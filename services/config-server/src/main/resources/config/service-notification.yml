# ====================================================================
# GESCO: service-notification specific configuration
# ====================================================================
server:
  port: 8084

spring:
  application:
    name: service-notification
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/gesco_notification}
    username: ${DB_USER:admin}
    password: ${DB_PASS:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
