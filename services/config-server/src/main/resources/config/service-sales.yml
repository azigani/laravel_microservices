# ====================================================================
# GESCO: service-sales specific configuration
# Fetched by service-sales at startup from the config-server
# ====================================================================
server:
  port: 8083

spring:
  application:
    name: service-sales
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/gesco_sales}
    username: ${DB_USER:admin}
    password: ${DB_PASS:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
