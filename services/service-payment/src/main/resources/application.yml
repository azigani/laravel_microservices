spring:
  application:
    name: service-payment
  cloud:
    config:
      uri: http://config-server:8888
      fail-fast: false
  datasource:
    url: jdbc:postgresql://postgres:5432/gesco_payment
    username: admin
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    host: rabbitmq

server:
  port: 8087

eureka:
  client:
    serviceUrl:
      defaultZone: http://discovery-server:8761/eureka/

payment:
  rabbitmq:
    sales-exchange: sales.exchange
    payment-exchange: payment.exchange
    invoice-queue: payment.invoice.queue
    sales-routing-key: sale.created
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:sk_test_fake_key_for_dev}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
